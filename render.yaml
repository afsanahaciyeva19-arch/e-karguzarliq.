services:
  - type: web
    name: e-karguzarliq
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: E_KARGUZAR_DATA_DIR
        value: /var/data
    disk:
      name: e-karguzar-data
      mountPath: /var/data
      sizeGB: 1
